name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Native Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify Built APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk class-10-ai-guru-official.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: class-10-ai-guru-official-apk
          path: class-10-ai-guru-official.apk

      - name: Publish APK to GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v1.0.0
          files: class-10-ai-guru-official.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
